<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mori-PMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f3;--sf:#fff;--tx:#14232b;--mu:#5d6f77;--ac:#0b7a75;--ac2:#e3f3f1;--bd:#d3dde0;--wr:#b3261e;--br:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--sf:#17262d;--tx:#e8f0f2;--mu:#93a6ae;--ac:#3cc2b9;--ac2:#14363a;--bd:#2b4048;--wr:#f2b8b5;--br:#e0b252;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1f;--sf:#17262d;--tx:#e8f0f2;--mu:#93a6ae;--ac:#3cc2b9;--ac2:#14363a;--bd:#2b4048;--wr:#f2b8b5;--br:#e0b252;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Manrope,system-ui,sans-serif}
h1,h2,h3{margin:0 0 8px}h2{font-size:18px}h3{font-size:14px;color:var(--mu);font-weight:600}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0b3f47;color:#fff;gap:8px}
header b{font-size:17px;font-weight:800}header small{opacity:.75}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:600 13px Manrope,sans-serif;cursor:pointer}
nav button.on{background:var(--ac2);color:var(--ac)}
main{padding:12px;max-width:1100px;margin:0 auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.k{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}.k b{display:block;font-size:20px;font-weight:800}.k span{color:var(--mu);font-size:12px}
.tot{background:var(--ac);color:#fff}.tot span{color:#fff;opacity:.85}
input,select,button.b{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);min-width:0}
button.b{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600;cursor:pointer}button.b.s{background:none;color:var(--tx);border-color:var(--bd)}button.b.d{background:none;color:var(--wr);border-color:var(--wr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:420px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.pos{display:grid;gap:12px;grid-template-columns:1fr}@media(min-width:800px){.pos{grid-template-columns:2fr 1fr}}
.it{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.it button{text-align:left;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px;cursor:pointer;font:inherit}.it button:disabled{opacity:.4}.it button b{display:block}.it button span{color:var(--mu);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac)}.tag.w1{background:#fbe9e7;color:var(--wr)}.tag.o{background:#fdf1d8;color:var(--br)}
.rm{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.rm div{border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--sf)}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--mu)}.bars i{display:block;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;display:none;z-index:9}
.login{max-width:460px;margin:4vh auto;padding:0 14px}.us{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.us button{min-height:64px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;font:600 15px Manrope,sans-serif;cursor:pointer;padding:8px}.us button small{display:block;color:var(--mu);font-weight:400}.us button.on{border-color:var(--ac);background:var(--ac2)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:12px auto}.pad button{min-height:68px;font:700 24px Manrope,sans-serif;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:14px;cursor:pointer}.dots{text-align:center;font-size:34px;letter-spacing:12px;min-height:44px}.oc{border-left:5px solid var(--ac)}.it button{min-height:76px}.tag.v{background:#fbe9e7;color:var(--wr)}.mu{color:var(--mu)}
</style></head><body><div id="app"></div><div id="t"></div>

gds(){return '<div class="card"><h3>GDS commission rates</h3><p class="mu">The percentage the hotel earns on each flight or vehicle booking.</p><div class="row"><label class="mu">Flights % <input id="gf" type="number" min="0" max="100" step="0.1" value="'+Math.round(RATE.flight*1000)/10+'" style="width:90px"></label><label class="mu">Vehicles % <input id="gv" type="number" min="0" max="100" step="0.1" value="'+Math.round(RATE.vehicle*1000)/10+'" style="width:90px"></label><button class="b" onclick="saveGR()">Save rates</button></div></div>'},
print(){return '<div class="card"><h3>Order routing</h3><p class="mu">Every order is split by item. Food goes to the Kitchen and drinks to the Bar, each as its own ticket. Items set to None, such as laundry or spa, need no preparation. Set a department per item under Menu &amp; prices.</p></div><div class="card"><h3>Printing</h3><div class="row"><label><input type="checkbox" id="pp" '+(S.print.pos?'checked':'')+' style="min-height:auto"> Print kitchen and bar tickets at the POS printer when an order is sent</label></div><div class="row"><label><input type="checkbox" id="pr" '+(S.print.rcpt?'checked':'')+' style="min-height:auto"> Print a receipt when a sale is closed</label></div><div class="row"><label class="mu">Paper <select id="pw">'+opts(['80','58'],String(S.print.paper))+'</select> mm</label><label class="mu">Header <input id="ph" value="'+esc(S.print.header)+'"></label><label class="mu">Receipt footer <input id="pf" value="'+esc(S.print.foot)+'"></label><button class="b" onclick="savePrint()">Save</button></div><small class="mu">Kitchen, Bar and Reception also receive every order on screen and can print their own copy.</small></div>'},
hotel(){return '<div class="card"><h3>Hotel</h3><div class="g"><div class="k"><b>'+fd(BD())+'</b><span>Business date'+(me.role==='Super Admin'?' (change under Business day)':'')+'</span></div><div class="k"><b>'+S.rooms.length+'</b><span>Total rooms</span></div></div></div>'+donutCard()}};
function saveItem(i){const it=S.items[i],n=$('mn'+i).value.trim(),pv=$('mp'+i).value;if(!n||pv===''||!(+pv>=0))return toast('Enter a name and a price.');it.name=n;it.cat=$('mc'+i).value.trim()||'General';it.price=+pv;it.re=+$('mr'+i).value||0;it.dept=$('md'+i).value;save();render();toast('Saved '+n+'.')}
function saveGR(){const f=+$('gf').value,v=+$('gv').value;if(!(f>=0&&f<=100&&v>=0&&v<=100))return toast('Enter rates between 0 and 100.');S.gr={flight:f,vehicle:v};save();render();toast('Rates saved.')}
const deptOf=i=>i.dept&&i.dept!=='Auto'?i.dept:(i.cat==='Food'?'Kitchen':i.cat==='Drinks'?'Bar':'None'),TL={new:'New',prep:'Preparing',ready:'Ready',served:'Served',void:'Cancelled'},pw=()=>S.print.paper===58?'58mm':'80mm';
let lastN=0,lastR=0;
function saveT(t){const i=S.tickets.findIndex(x=>x.id===t.id);if(i<0)S.tickets.push(t);else S.tickets[i]=t;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(DB)DB.collection('tickets').doc(t.id).set(t).catch(warn)}
function mkTickets(o,ls,note){const out=[];['Kitchen','Bar'].forEach(d=>{const l=ls.filter(x=>x.dept===d);if(!l.length)return;const t={id:uid(),oid:o.id,no:o.no,table:o.table||'',waiter:o.staff,dept:d,lines:l.map(x=>({name:x.name,qty:x.qty})),note:(note||'').trim(),st:'new',ts:Date.now(),bd:BD()};saveT(t);out.push(t)});return out}
function tk(id,st){const t=S.tickets.find(x=>x.id===id);if(!t)return;if(['Kitchen','Bar'].includes(me.role)&&me.role!==t.dept&&st!=='served')return toast('That ticket belongs to the '+t.dept+'.');t.st=st;const n=Date.now();if(st==='prep'){t.tp=n;t.by=me.name}if(st==='ready'){t.tr=n;t.by=t.by||me.name}if(st==='served')t.tsv=n;saveT(t);render()}
function tkChips(o){const ts=S.tickets.filter(t=>t.oid===o.id&&t.st!=='gone');return ts.length?'<div class="row" style="margin:6px 0">'+ts.map(t=>'<span class="tag '+(t.st==='ready'?'':t.st==='void'?'v':'o')+'">'+t.dept+' · '+TL[t.st]+'</span>'+(t.st==='ready'?'<button class="b s" onclick="tk(\''+t.id+'\',\'served\')">Mark served</button>':'')+'<button class="b s" onclick="printT([S.tickets.find(x=>x.id===\''+t.id+'\')])">Print</button>').join('')+'</div>':''}
function tc(t){const m=Math.max(0,Math.round((Date.now()-t.ts)/60000)),can=!['Kitchen','Bar'].includes(me.role)||me.role===t.dept,b=(st,lab,c)=>'<button class="b '+(c||'')+'" onclick="tk(\''+t.id+'\',\''+st+'\')">'+lab+'</button>';
 return '<div class="card oc" style="'+(t.st==='void'?'border-left-color:var(--wr)':'')+'"><div class="row"><b style="flex:1;font-size:16px">#'+t.no+' · '+esc(t.table||'No table')+'</b><span class="tag o">'+t.dept+'</span><span class="mu">'+m+' min</span></div><div class="mu">'+esc(t.waiter)+'</div>'+t.lines.map(l=>'<div style="font-size:16px;font-weight:700">'+l.qty+' × '+esc(l.name)+'</div>').join('')+(t.note?'<div class="tag o" style="margin-top:6px">Note: '+esc(t.note)+'</div>':'')+(t.st==='void'?'<p style="color:var(--wr);font-weight:700">CANCELLED. Stop preparing.</p>':'')+'<div class="row" style="margin-top:8px">'+(can?(t.st==='new'?b('prep','Start')+b('ready','Ready','s'):t.st==='prep'?b('ready','Ready'):t.st==='ready'?b('served','Served'):t.st==='void'?b('gone','Dismiss'):''):'')+'<button class="b s" onclick="printT([S.tickets.find(x=>x.id===\''+t.id+'\')])">Print</button><button class="b s" onclick="saveT1(\''+t.id+'\')">Save</button></div></div>'}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
function alertNew(){if(!me)return;const n=S.tickets.filter(t=>t.st==='new'&&(me.role==='Kitchen'?t.dept==='Kitchen':me.role==='Bar'&&t.dept==='Bar')).length,r=S.tickets.filter(t=>t.st==='ready'&&(S.orders.find(o=>o.id===t.oid)||{}).sid===me.id).length;if(n>lastN||r>lastR)beep();lastN=n;lastR=r}
function tkHTML(ls){return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ticket</title><style>@page{size:'+pw()+' auto;margin:2mm}body{font:13px/1.35 monospace;width:'+pw()+';margin:0;color:#000}.t{padding:6px;page-break-after:always}h1{font-size:22px;margin:4px 0;text-align:center}.c{text-align:center}hr{border:0;border-top:1px dashed #000}.l{font-size:16px;font-weight:bold}</style></head><body>'+ls.map(t=>'<div class="t"><div class="c">'+esc(S.print.header)+'</div><h1>'+t.dept.toUpperCase()+'</h1><hr>Order #'+t.no+' · Table '+esc(t.table||'-')+'<br>Waiter: '+esc(t.waiter)+'<br>'+new Date(t.ts).toLocaleString('en-NG')+'<hr>'+t.lines.map(l=>'<div class="l">'+l.qty+' × '+esc(l.name)+'</div>').join('')+(t.note?'<hr>NOTE: '+esc(t.note):'')+'<hr></div>').join('')+'</body></html>'}
function recHTML(o){return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt</title><style>@page{size:'+pw()+' auto;margin:2mm}body{font:13px/1.4 monospace;width:'+pw()+';margin:0;padding:6px;color:#000}h1{font-size:18px;text-align:center;margin:2px 0}.c{text-align:center}hr{border:0;border-top:1px dashed #000}.r{display:flex;justify-content:space-between}</style></head><body><h1>'+esc(S.print.header)+'</h1><div class="c">Sales receipt</div><hr>Order #'+o.no+' · Table '+esc(o.table||'-')+'<br>Date: '+fd(o.cbd||BD())+'<br>Served by: '+esc(o.staff)+'<hr>'+o.lines.map(l=>'<div class="r"><span>'+l.qty+' × '+esc(l.name)+'</span><span>'+N(l.qty*l.price)+'</span></div>').join('')+'<hr><div class="r"><b>TOTAL</b><b>'+N(o.total)+'</b></div><div>Paid by '+esc(o.method||'-')+'</div><hr><div class="c">'+esc(S.print.foot)+'</div></body></html>'}
function printH(h,name){let d=0;const fb=()=>{if(!d++)save1(name,h)};try{const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;opacity:0';f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){fb()}setTimeout(()=>f.remove(),5000)};f.srcdoc=h;document.body.appendChild(f)}catch(e){fb()}}
function printT(ls){ls=ls.filter(Boolean);if(ls.length)printH(tkHTML(ls),'ticket-'+ls[0].no+'.html')}
function printR(id){const o=S.orders.find(x=>x.id===id);if(o)printH(recHTML(o),'receipt-'+o.no+'.html')}
function saveT1(id){const t=S.tickets.find(x=>x.id===id);if(t)save1('ticket-'+t.no+'-'+t.dept+'.html',tkHTML([t]))}
function savePrint(){S.print={pos:$('pp').checked,rcpt:$('pr').checked,paper:+$('pw').value,header:$('ph').value.trim()||'Mori-PMS',foot:$('pf').value.trim()};save();render();toast('Printing settings saved.')}
setInterval(()=>{if(me&&tab==='kds')soft()},30000);
function addC(id){const i=S.items.find(x=>x.id===id),l=cart.find(x=>x.id===id);if(l){if(l.qty<avail(i))l.qty++}else cart.push({id,name:i.name,cat:i.cat,price:i.price,qty:1,dept:deptOf(i)});render()}
function chgC(id,d){const l=cart.find(x=>x.id===id),i=S.items.find(x=>x.id===id);l.qty=Math.min(avail(i),l.qty+d);if(l.qty<1)cart=cart.filter(x=>x!==l);render()}
function sendO(){if(!cart.length)return toast('Add an item first.');let o=cur&&S.orders.find(x=>x.id===cur&&x.status==='open');if(cur&&!o){cur=null;cart=[];render();return toast('That order was already closed or voided.')}
 if(!o){S.seq++;o={id:uid(),no:S.seq,table:tv.trim(),staff:me.name,sid:me.id,ts:Date.now(),bd:BD(),lines:[],status:'open'};save()}
 cart.forEach(c=>{const l=o.lines.find(x=>x.id===c.id);if(l)l.qty+=c.qty;else o.lines.push(Object.assign({},c))});o.total=o.lines.reduce((t,l)=>t+l.qty*l.price,0);saveO(o);const nk=mkTickets(o,cart,nt);cart=[];cur=null;tv='';nt='';if(S.print.pos&&nk.length)printT(nk);render();toast('Order #'+o.no+' sent'+(nk.length?' to '+nk.map(t=>t.dept).join(' & '):'')+'.')}
function closeO(id){const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='open')return;o.status='closed';o.method=$('m'+id).value;o.closedBy=me.name;o.closedTs=Date.now();o.cbd=BD();saveO(o);if(S.print.rcpt)printR(id);render();toast('Sale closed.')}
function voidO(id){if(arm!==id){arm=id;return render()}const o=S.orders.find(x=>x.id===id);if(!o||o.status!=='open')return;o.status='void';o.reason=$('v'+id).value;o.voidBy=me.name;o.voidTs=Date.now();o.vbd=BD();arm='';saveO(o);S.tickets.filter(t=>t.oid===id&&t.st!=='served'&&t.st!=='gone').forEach(t=>{t.st='void';saveT(t)});render();toast('Order voided. Stock returned.')}
function addI(){const n=$('sn').value.trim(),p=+$('sp').value;if(!n||!(p>0))return toast('Enter a name and price.');S.items.push({id:uid(),name:n,cat:$('sc').value.trim()||'General',price:p,stock:+$('sq').value||0,re:+$('sr').value||0,dept:'Auto'});save();render()}
function rcv(id){const q=+$('r'+id).value;if(!(q>0))return toast('Enter a quantity.');S.items.find(i=>i.id===id).stock+=q;save();render();toast('Stock updated.')}
function delI(id){if(arm!==id){arm=id;return render()}S.items=S.items.filter(i=>i.id!==id);arm='';save();render()}
function checkIn(){const g=$('gn').value.trim(),n=Math.max(1,+$('gd').value||1),r=S.rooms.find(x=>x.no===$('gr').value);if(!g)return toast('Enter the guest name.');r.busy=true;S.bookings.push({id:uid(),ts:Date.now(),bd:BD(),guest:g,room:r.no,nights:n,amt:r.rate*n,out:false});save();render();toast('Guest checked in.')}
function checkOut(id){const b=S.bookings.find(x=>x.id===id);b.out=true;S.rooms.find(r=>r.no===b.room).busy=false;save();render()}
function gdsBook(){const g=$('xg').value.trim(),inv=gt==='flight'?FL:CR,x=inv[+$('xi').value],q=Math.max(1,+$('xq').value||1);if(!g)return toast('Enter the guest name.');const fare=x[1]*q;S.gds.push({id:uid(),ts:Date.now(),bd:BD(),guest:g,detail:x[0]+' × '+q,fare,comm:fare*RATE[gt]});save();render();toast('Booked. Commission recorded.')}
function addU(){const n=$('un').value.trim(),p=$('up').value.trim();if(!n||!/^\d{4}$/.test(p))return toast('Enter a name and a 4-digit PIN.');S.staff.push({id:uid(),name:n,role:$('ur').value,pin:p});save();render();toast('User registered.')}
function delU(id){const u=S.staff.find(x=>x.id===id);if(u.id===me.id)return toast('You can’t delete your own account.');if(/Admin/.test(u.role)&&me.role!=='Super Admin')return toast('Only a Super Admin can remove admins.');if(u.role==='Super Admin'&&S.staff.filter(x=>x.role==='Super Admin').length<2)return toast('Keep at least one Super Admin.');if(arm!==id){arm=id;return render()}S.staff=S.staff.filter(x=>x.id!==id);arm='';save();render()}
function rep(){const d=rpd||BD(),y=d.slice(0,4),mo=d.slice(0,7),f=rpm==='day'?d:rpm==='month'?mo+'-01':y+'-01-01',t=rpm==='day'?d:rpm==='month'?mo+'-31':y+'-12-31';
 const m=M(f,t),vd=S.orders.filter(o=>{const v=o.vbd||ymd(o.voidTs);return o.status==='void'&&v>=f&&v<=t}),ln=m.s.flatMap(x=>x.lines),fare=sum(m.g,'fare');
 const title='Mori-PMS — '+{day:'Daily',month:'Monthly',year:'Yearly'}[rpm]+' sales report: '+(rpm==='day'?fd(d):rpm==='month'?new Date(mo+'-15T12:00:00').toLocaleDateString('en-NG',{month:'long',year:'numeric'}):y);
 const sm=[['Total revenue',m.t,1],['POS sales',m.p,1],['Orders closed',m.s.length,0],['Room revenue',m.r,1],['Stays checked in',m.b.length,0],['GDS commission',m.c,1],['GDS fare volume',fare,1],['Voided orders',vd.length,0],['Voided value',sum(vd,'total'),1]];
 const T=[];
 if(rpm!=='day'){const kf=x=>rpm==='year'?bdOf(x).slice(0,7):bdOf(x),ks={},add=(x,i,v)=>{const k=kf(x);(ks[k]=ks[k]||[0,0,0])[i]+=v};m.s.forEach(x=>add(x,0,x.total));m.b.forEach(x=>add(x,1,x.amt));m.g.forEach(x=>add(x,2,x.comm));
  T.push({name:rpm==='year'?'By month':'By day',head:[rpm==='year'?'Month':'Date','POS sales','Rooms','GDS commission','Total'],money:[1,2,3,4],rows:Object.keys(ks).sort().map(k=>[k,ks[k][0],ks[k][1],ks[k][2],ks[k][0]+ks[k][1]+ks[k][2]])})}
 T.push({name:'By category',head:['Category','Amount'],money:[1],rows:grp(ln,l=>l.cat,l=>l.qty*l.price)});
 const it={};ln.forEach(l=>{const e=it[l.name]=it[l.name]||[l.name,0,0];e[1]+=l.qty;e[2]+=l.qty*l.price});
 T.push({name:'Items sold',head:['Item','Qty','Amount'],money:[2],rows:Object.values(it).sort((a,b)=>b[2]-a[2])});
 T.push({name:'Payment methods',head:['Method','Amount'],money:[1],rows:grp(m.s,x=>x.method,x=>x.total)});
 T.push({name:'Sales by staff',head:['Staff','Amount'],money:[1],rows:grp(m.s,x=>x.staff,x=>x.total)});
 return{title,sum:sm,tables:T}}
async function save1(n,d){try{const x=window.claude&&await claude.use('downloads');if(!x)return toast('Downloads aren’t available here.');await x.save({filename:n,data:d});toast('File saved.')}catch(e){toast(e&&e.code==='declined'?'Download cancelled.':'Couldn’t save the file.')}}
function dl(k){const R=rep(),q=v=>'"'+String(v).replace(/"/g,'""')+'"',nm='mori-pms-'+rpm+'-report-'+(rpd||BD()),now=new Date().toLocaleString('en-NG');
 if(k==='csv'){const L=[[R.title],['Generated',now],[],['Summary']];R.sum.forEach(x=>L.push([x[0],x[1]]));R.tables.forEach(tb=>{L.push([],[tb.name],tb.head);tb.rows.forEach(r=>L.push(r))});return save1(nm+'.csv','\ufeff'+L.map(r=>r.map(q).join(',')).join('\r\n'))}
 const c=(tb,v,j)=>'<td>'+(tb.money.includes(j)?N(v):esc(v))+'</td>';
 return save1(nm+'.html','<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(R.title)+'</title><style>body{font:14px Arial,sans-serif;margin:24px;color:#111}table{border-collapse:collapse;width:100%;margin:6px 0 18px}td,th{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#eee}</style></head><body><h2>'+esc(R.title)+'</h2><p>Generated '+esc(now)+'</p><table>'+R.sum.map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+(x[2]?N(x[1]):esc(x[1]))+'</td></tr>').join('')+'</table>'+R.tables.map(tb=>'<h3>'+esc(tb.name)+'</h3><table><tr>'+tb.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+tb.rows.map(r=>'<tr>'+r.map((v,j)=>c(tb,v,j)).join('')+'</tr>').join('')+'</table>').join('')+'</body></html>')}
async function csv(){const m=M(from()),rows=[['Date','Staff','Table','Method','Total']].concat(m.s.map(s=>[s.bd,s.staff,s.table,s.method,s.total]));await save1('sales-'+rp+'.csv','\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'))}
render();initDb();
</script></body></html>
